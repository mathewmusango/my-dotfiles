name: checks
services:
  jsonc:
    image: docker.io/library/python:alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["sh", "-c", "python3 scripts/checks/jsonc.py && if ls fastfetch/*/ >/dev/null 2>&1; then for d in fastfetch/*/; do if [ ! -f \"$$d/config.jsonc\" ] || [ ! -f \"$$d/screenshot.png\" ]; then echo \"incomplete design: $$d\"; exit 1; fi; done; echo '✅ all designs complete'; else echo '✅ no fastfetch designs — skipping'; fi"]

  shell:
    image: docker.io/koalaman/shellcheck-alpine:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["sh", "-c", "find . -path './.git' -prune -o -type f \\( -name '*.sh' -o -path './.githooks/*' \\) -print0 2>/dev/null | xargs -0 -r shellcheck -S warning"]

  python:
    image: ghcr.io/astral-sh/ruff:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["check", ".", "--no-cache"]

  yaml:
    # raven-actions/actionlint@v2 runs plain `actionlint` — no path args (it
    # scans .github/workflows recursively, covering checks/). The image
    # ENTRYPOINT is actionlint, so args only, no leading tool name.
    image: docker.io/rhysd/actionlint:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["-no-color"]

  yaml-syntax:
    image: docker.io/library/ruby:alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["sh", "-c", "find . -path './.git' -prune -o -type f \\( -name '*.yml' -o -name '*.yaml' \\) -print 2>/dev/null | while IFS= read -r f; do ruby -ryaml -e \"YAML.load_file(ARGV[0])\" \"$$f\" || { echo \"FAILED: $$f\"; exit 1; }; done || exit 1; echo '✅ yaml-syntax: all files parsed'"]

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
      - ./gitleaks.toml:/etc/gitleaks/gitleaks.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d .git ]; then
          echo "gitleaks: scanning all commits"
          exec gitleaks git . --log-opts=--all --config /etc/gitleaks/gitleaks.toml --no-banner -v --redact
        else
          echo "gitleaks: .git is a file (umbrella gitdir) — scanning the whole working tree"
          exec gitleaks dir . --config /etc/gitleaks/gitleaks.toml --no-banner -v --redact
        fi
